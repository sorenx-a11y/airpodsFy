workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 120
    environment:
      xcode: 26.5
      cocoapods: default
      vars:
        XCODE_PROJECT: "AirPodsTranslate.xcodeproj"
        XCODE_SCHEME: "AirPodsTranslate"
    cache:
      cache_paths:
        - $CM_BUILD_DIR/.build
        - $HOME/Library/Developer/Xcode/DerivedData
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Resolve Swift Package dependencies
        script: xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -resolvePackageDependencies
      - name: Build for simulator (no signing required)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -quiet
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
