workflows:
  ios-ipa-unsigned:
    name: iOS Unsigned IPA
    max_build_duration: 120
    environment:
      xcode: 26.5
      vars:
        XCODE_PROJECT: "AirPodsTranslate.xcodeproj"
        XCODE_SCHEME: "AirPodsTranslate"
        APP_NAME: "AirPodsTranslate"
    cache:
      cache_paths:
        - $CM_BUILD_DIR/.build
        - $HOME/Library/Developer/Xcode/DerivedData
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Resolve Swift Package dependencies
        script: xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -resolvePackageDependencies
      - name: Archive without code signing
        script: |
          set -e
          rm -rf build
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ENTITLEMENTS_REQUIRED=NO
      - name: Package unsigned IPA (Payload/.app)
        script: |
          set -e
          APP_PATH=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "Found app: $APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -qry "build/${APP_NAME}-unsigned.ipa" Payload
          rm -rf Payload
          echo "Built: build/${APP_NAME}-unsigned.ipa"
    artifacts:
      - build/*.ipa
      - build/App.xcarchive
